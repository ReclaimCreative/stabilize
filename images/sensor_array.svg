<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 460" width="780" height="460" style="background:#1a1c22;">

  <!-- Active field -->
  <rect x="100" y="60" width="580" height="340" fill="#22252d" stroke="#2c2f38" stroke-width="1.5"/>

  <!-- Axis labels -->
  <text x="384" y="428" font-size="13" fill="#8a8a8a" font-family="Courier New,monospace" text-anchor="middle" letter-spacing="0.15em">X</text>
  <text x="700" y="234" font-size="13" fill="#8a8a8a" font-family="Courier New,monospace" text-anchor="middle" letter-spacing="0.15em">Y</text>

  <!-- Active field label -->
  <text x="590" y="370" font-size="11" fill="#3a3f4a" font-family="Arial,sans-serif" text-anchor="middle" letter-spacing="0.12em">ACTIVE FIELD</text>

  <!-- D baseline (distance between sensors) -->
  <line x1="60" y1="78" x2="60" y2="382" stroke="#2c2f38" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="52" y1="78" x2="68" y2="78" stroke="#8a8a8a" stroke-width="1"/>
  <line x1="52" y1="382" x2="68" y2="382" stroke="#8a8a8a" stroke-width="1"/>
  <text x="38" y="234" font-size="14" fill="#8a8a8a" font-family="Courier New,monospace" text-anchor="middle" font-style="italic">D</text>

  <!-- R2: Sensor 1 → P (blue) -->
  <line x1="100" y1="78" x2="468" y2="198" stroke="#50b4ff" stroke-width="1.8"/>
  <!-- R1: Sensor 2 → P (orange) -->
  <line x1="100" y1="382" x2="468" y2="198" stroke="#ffa028" stroke-width="1.8"/>

  <!-- Angle Θ at Sensor 1 — arc between vertical and R2 -->
  <path d="M 100 100 A 22 22 0 0 1 117 84" fill="none" stroke="#50b4ff" stroke-width="1.3"/>
  <text x="116" y="112" font-size="14" fill="#50b4ff" font-family="Georgia,serif" font-style="italic">&#920;</text>

  <!-- Angle β at Sensor 2 — arc between vertical and R1 -->
  <path d="M 100 360 A 22 22 0 0 0 117 373" fill="none" stroke="#ffa028" stroke-width="1.3"/>
  <text x="116" y="367" font-size="14" fill="#ffa028" font-family="Georgia,serif" font-style="italic">&#946;</text>

  <!-- Angle φ at P — small arc -->
  <path d="M 449 205 A 22 22 0 0 1 452 183" fill="none" stroke="#64dc64" stroke-width="1.3"/>
  <text x="426" y="208" font-size="14" fill="#64dc64" font-family="Georgia,serif" font-style="italic">&#966;</text>

  <!-- R2 label (midpoint ~284, 138) -->
  <text x="272" y="128" font-size="13" fill="#50b4ff" font-family="Courier New,monospace" font-style="italic">R2</text>

  <!-- R1 label (midpoint ~284, 290) -->
  <text x="272" y="308" font-size="13" fill="#ffa028" font-family="Courier New,monospace" font-style="italic">R1</text>

  <!-- Sensor 1 -->
  <rect x="90" y="68" width="20" height="20" rx="2" fill="#d4924a" stroke="#8a5c28" stroke-width="1.5"/>
  <text x="100" y="52" font-size="12" fill="#f0eeea" font-family="Arial,sans-serif" text-anchor="middle" font-weight="700" letter-spacing="0.05em">SENSOR 1</text>

  <!-- Sensor 2 -->
  <rect x="90" y="372" width="20" height="20" rx="2" fill="#d4924a" stroke="#8a5c28" stroke-width="1.5"/>
  <text x="100" y="412" font-size="12" fill="#f0eeea" font-family="Arial,sans-serif" text-anchor="middle" font-weight="700" letter-spacing="0.05em">SENSOR 2</text>

  <!-- Point P -->
  <circle cx="468" cy="198" r="6" fill="#64dc64" stroke="#3a8a3a" stroke-width="1.5"/>
  <text x="482" y="194" font-size="12" fill="#f0eeea" font-family="Courier New,monospace">P(x, y)</text>

</svg>
